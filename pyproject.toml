[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "genesis-ufactory"
version = "0.2.2"
description = "UFACTORY robot models and Genesis simulation utilities"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "UFACTORY"},
]
maintainers = [
    {name = "UFACTORY"},
]
keywords = ["ufactory", "xarm", "genesis", "simulation", "robotics", "urdf", "robot-learning"]
dependencies = [
    "numpy",
    "pyyaml",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/DanielWang123321/ufactory_genesis"
Repository = "https://github.com/DanielWang123321/ufactory_genesis"
Issues = "https://github.com/DanielWang123321/ufactory_genesis/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
dynamics = [
    "matplotlib>=3.8",
    "pin>=3.0.0",
]
real = [
    "xarm-python-sdk",
]
rl = [
    "rsl-rl-lib==2.2.4",
    "tensorboard",
]
showcase = [
    "scipy>=1.11",
]
# Optional trajectory-planning reference backend. The default planner/profile
# stack is pure NumPy; installing this extra enables roboticstoolbox-based
# comparison and future advanced planning adapters.
trajectory = [
    "roboticstoolbox-python>=1.3.0",
]

[project.scripts]
dynamics-sim-check = "ufactory.dynamics.cli:cli_sim_check"
dynamics-sim-collision-check = "ufactory.dynamics.cli:cli_sim_collision_check"
dynamics-hardware-check = "ufactory.dynamics.cli:cli_hardware_check"
dynamics-report-compare = "ufactory.dynamics.cli:cli_report_compare"
observe-hold-current = "ufactory.hardware.observe:cli_observe_hold_current"

# NOTE: This project is designed for editable install (pip install -e .).
# Assets (URDF, STL, GLB) live outside the Python package in assets/ and
# are resolved relative to PROJECT_ROOT at runtime. For a standard pip
# install, assets must be packaged via MANIFEST.in + package_data (future).

[tool.setuptools.packages.find]
where = ["."]
include = ["ufactory*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
norecursedirs = ["dev"]
markers = [
    "hardware: tests requiring xArm SDK or real robot network",
    "gpu: in-process Genesis GPU simulation",
    "integration: end-to-end subprocess smoke tests (examples, short RL runs)",
    "display: subprocess tests requiring DISPLAY for visual dry-run",
    "slow: long-running dev/ref_scripts capture tests",
]
