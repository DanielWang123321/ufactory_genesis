schema_version: 1
environment:
  num_envs: 2048
  num_obs: 30
  num_actions: 7
  action_scale: 0.01
  action_clip: 1.0
  max_joint_delta_rad: 0.01
  gripper_delta_mm: 4.0
  success_history_len: 2000
  stiffen_gripper_mimic: true
reward:
  reach: 4.0
  align: 3.0
  close_gripper: 3.0
  lift: 8.0
  grasp: 15.0
  place: 4.0
  release: 15.0
  success: 10.0
  action_penalty: 0.0005
  table_collision: 5.0
  workspace_violation: 2.0
train:
  algorithm:
    class_name: PPO
    clip_param: 0.2
    desired_kl: 0.01
    entropy_coef: 0.005
    gamma: 0.99
    lam: 0.95
    learning_rate: 0.0003
    max_grad_norm: 1.0
    num_learning_epochs: 5
    num_mini_batches: 4
    schedule: adaptive
    use_clipped_value_loss: true
    value_loss_coef: 1.0
  init_member_classes: {}
  policy:
    activation: elu
    actor_hidden_dims: [256, 256, 128]
    critic_hidden_dims: [256, 256, 128]
    init_noise_std: 0.5
    class_name: ActorCritic
  runner:
    checkpoint: -1
    experiment_name: xarm6-pick-place-joint-g2
    load_run: -1
    log_interval: 1
    max_iterations: 3000
    record_interval: -1
    resume: false
    resume_path: null
    run_name: ""
  runner_class_name: OnPolicyRunner
  num_steps_per_env: 200
  save_interval: 100
  empirical_normalization: null
  seed: 1
