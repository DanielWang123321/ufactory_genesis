schema_version: 1
environment:
  num_envs: 2048
  num_obs: 30
  num_actions: 4
  action_scale: 0.01
  action_clip: 1.0
  max_cartesian_delta_m: 0.01
  max_ik_jump_rad: 0.5
  gripper_delta_mm: 4.0
  success_history_len: 2000
  stiffen_gripper_mimic: true
  # Lock object/target to trajectory pick-place fixed poses (curriculum off).
  fixed_demo_layout: true
  place_phase_reset_frac: 0.25
  place_phase_hover_z_m: 0.07
reward:
  keypoints: 6.0
  reach: 2.0
  align: 0.0
  close_gripper: 3.0
  lift: 6.0
  grasp: 10.0
  place_xy: 6.0
  place_z: 12.0
  lower: 8.0
  holding_table: 2.0
  release: 25.0
  success: 50.0
  action_penalty: 0.0005
  table_collision: 2.0
  workspace_violation: 2.0
train:
  algorithm:
    class_name: PPO
    clip_param: 0.2
    desired_kl: 0.01
    entropy_coef: 0.005
    gamma: 0.99
    lam: 0.95
    learning_rate: 0.0003
    max_grad_norm: 1.0
    num_learning_epochs: 5
    num_mini_batches: 4
    schedule: adaptive
    use_clipped_value_loss: true
    value_loss_coef: 1.0
    rnd_cfg: null
    symmetry_cfg: null
  actor:
    class_name: MLPModel
    hidden_dims: [256, 256, 128]
    activation: elu
    obs_normalization: false
    distribution_cfg:
      class_name: GaussianDistribution
      init_std: 0.5
  critic:
    class_name: MLPModel
    hidden_dims: [256, 256, 128]
    activation: elu
    obs_normalization: false
  obs_groups:
    actor: [policy]
    critic: [policy]
  runner:
    checkpoint: -1
    experiment_name: xarm6-pick-place-cart-xyz-g2
    load_run: -1
    log_interval: 1
    max_iterations: 3000
    record_interval: -1
    resume: false
    resume_path: null
    run_name: ""
  num_steps_per_env: 200
  save_interval: 100
  seed: 1
  run_name: ""
  logger: tensorboard
