schema_version: 1
simulation:
  backend: gpu
  precision: "32"
  seed: 1
  # Conservative 32-substep production margin for G2 contact scenes at 50 Hz.
  # The compliant mimic equality profile is the primary numerical-stability fix.
  substeps: 32
  constraint_solver: newton
  solver_iterations: 100
  noslip_iterations: 0
  friction_cone: pyramidal
  contact_resolution: convex
  constraint_time_constant_s: 0.005
  # Genesis documents GJK as the slower but more stable collision path.
  use_gjk_collision: true
  show_viewer: false
  g2:
    position_mm: 0.0
    speed_percent: 50.0
    force_percent: 50.0
