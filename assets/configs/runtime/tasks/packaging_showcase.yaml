schema_version: 1
task:
  name: packaging_showcase
  parameters:
    # All task geometry is expressed in the xArm base frame. The simulated
    # display rotates the base +90 degrees in world Z, but the real path uses
    # these values directly.
    object_size_m: [0.030, 0.030, 0.030]
    object_mass_kg: 0.017
    fixed_object_position_m: [0.300, 0.000, 0.015]
    # Match the pick-place XY target. Z is 3 mm higher because the cube rests
    # on the cardboard floor rather than directly on the base-frame table.
    fixed_target_position_m: [0.300, 0.300, 0.018]
    # Nominal task geometry exactly matches the xArm6 pick-place example.
    default_ee_position_m: [0.300, 0.000, 0.300]

    # Genesis-only display/contact correction. Dry-run, SDK simulation and
    # hardware execution keep the nominal geometry above unchanged.
    simulation_grasp_center_compensation_xy_m: [0.0025, 0.0000]
    simulation_arm_kp_scale: 1.5
    simulation_release_duration_s: 0.020
    # Genesis 1.3.3 at 32 substeps releases cleanly with the one-tick full-open
    # target. A gradual preload-relax phase lets gravity start the drop before
    # the G2 fingers have opened by the required 3 mm clearance.
    simulation_pre_release_relax_gap_m: 0.029
    simulation_pre_release_relax_duration_s: 0.000
    simulation_home_settle_s: 0.800

    table_size_m: [0.800, 1.200, 0.040]
    table_center_m: [0.337, 0.000, -0.020]

    # The box long edge follows robot-base +X. The display robot is yawed
    # +90 degrees, so the long edge appears along world +Y in Genesis.
    box_outer_size_m: [0.300, 0.200, 0.150]
    box_center_xy_m: [0.300, 0.300]
    box_wall_thickness_m: 0.003
    box_floor_top_z_m: 0.003

    pregrasp_clearance_m: 0.100
    release_object_bottom_clearance_m: 0.050
    grasp_gap_m: 0.022
    grasp_settle_s: 0.500
    pre_release_settle_s: 0.500
    post_release_settle_s: 0.500
    # The unified 32-substep Genesis baseline restores the 25 mm accuracy gate.
    place_success_distance_m: 0.025
    lift_success_clearance_m: 0.100
    home_success_distance_m: 0.010
  allowed_contacts:
    start: []
    "home->pregrasp": []
    descend: []
    grip: [finger_links_to_object]
    grip-settle: [finger_links_to_object]
    lift: [finger_links_to_object]
    transit: [finger_links_to_object]
    pre-release-settle: [finger_links_to_object]
    release: [finger_links_to_object]
    post-release-settle: []
    return-transit: []
    return-home: []
