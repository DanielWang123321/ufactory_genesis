schema_version: 1
task:
  name: pick_place
  parameters:
    episode_length_s: 10.0
    control_dt_s: 0.02
    table_height_m: 0.4
    object_size_m: [0.030, 0.030, 0.030]
    object_mass_kg: 0.017
    # Base-frame layout matches the v0.2.4 trajectory scene (obj at +x, place at +y).
    # The shared 30 mm cube rests on the base-frame z=0 table, so its center is z=15 mm.
    fixed_object_position_m: [0.30, 0.00, 0.015]
    fixed_target_position_m: [0.30, 0.30, 0.015]
    default_ee_position_m: [0.30, 0.00, 0.30]
    object_spawn_lower_m: [0.28, -0.05, 0.015]
    object_spawn_upper_m: [0.34, 0.05, 0.015]
    target_spawn_lower_m: [0.28, 0.25, 0.015]
    target_spawn_upper_m: [0.34, 0.35, 0.015]
    grasp_center_offset_z_m: 0.065
    # Preserve the v0.2.6 RL lift-reward normalization and workspace contract.
    # CLI trajectory heights remain independently derived from dry_heights().
    lift_height_m: 0.08
    workspace_lower_m: [0.10, -0.35, -0.02]
    workspace_upper_m: [0.65, 0.35, 0.55]
    place_success_distance_m: 0.04
    success_hold_steps: 10
    substeps: 4
  allowed_contacts:
    start: []
    "home->pregrasp": []
    descend: []
    grip: [finger_links_to_object]
    grip-settle: [finger_links_to_object]
    lift: [finger_links_to_object]
    transit: [finger_links_to_object]
    place-descend: [finger_links_to_object, object_to_table]
    place-settle: [finger_links_to_object, object_to_table]
    release: [finger_links_to_object, object_to_table]
    retreat: [object_to_table]
    return-home: []
