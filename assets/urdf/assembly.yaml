# Runtime URDF assembly: arm + base plate / camera stand / cameras / end-effector parts.
#
# ufactory.robots.assembly composes "arm URDF [+ base plate] [+ accessory] [+ end-effector part]" into one
# deterministic URDF under .cache/ufactory/urdf/composed/ (relative mesh paths, content-addressed file name).
# Arm sources come from the robot registry: visual "glb" uses <key>_visual.glb.urdf, visual "stl" uses the default
# <key>.urdf.
#
# flanges.<name>:
#   robots          robot profile keys sharing this tool flange. Each robot's ee_link (registry) is the flange
#                   frame: origin at the centre of the flange face, +Z out of the face.
#
# end_effectors.<name>:
#   source          part URDF (relative to assets/urdf) with per-link GLB visuals; its root link (preview
#                   "world" or a mount stub) and the joint into base_link are dropped when composing
#   base_link       part root link attached to the arm flange
#   mount_joint     name of the fixed joint created between the flange and base_link
#   flange          flange the part mounts on; compatible robots are that flange's robots
#   mount           optional base_link pose {xyz, rpy} in the flange frame, same on every robot of the
#                   flange; identity when absent
#   glb_visuals     optional per-link GLB that replaces the source visual when visual is "glb"
#   stl_visuals     optional per-link mesh that replaces the source visual when visual is "stl"
#   stl_materials   optional per-link material for visual "stl" ("*" = default), given to stl_visuals that
#                   carry none and to the remaining GLB visuals, which become the link's collision geometry
#                   in that mode
#
# spacers.<name>: a plate clamped between the flange and the end effector (it may carry a camera)
#   source, base_link, mount_joint, flange (or flanges), mount, stl_visuals, stl_materials: as for end_effectors
#   tool_lift_m     the end effector mount (or the arm's link_eef when there is none) moves this far along flange +Z
#   end_effectors   end effectors that fit on the spacer; the bare arm always does
#
# cameras.<name>: a camera on a spacer
#   source, base_link, mount_joint, stl_materials: as for end_effectors; visual "stl" draws the collision boxes
#   spacer          spacer the camera mounts on; robots and end effectors are the spacer's
#   mount           base_link pose {xyz, rpy} in the spacer's base_link frame
#   optical_frame   link with the OpenCV optical frame (+X right, +Y down, +Z forward), uncalibrated
#
# base_plates.<name>: a mounting base plate fixed below the arm's link_base (top mounting surface z = 0)
#   source, base_link, mount_joint, stl_visuals, stl_materials: as for end_effectors
#   robots          robot profile keys fitting this plate (each robot appears in at most one base plate)
#   thickness_m     plate thickness (m); the plate occupies z in [-thickness_m, 0]
#   mount           base_link pose {xyz, rpy} in the arm's link_base frame
schema_version: 4
flanges:
  xarm:
    # One part on xArm5/6/7; same layout on UF850: PCD 50 mm, 4 x M6 at 45/135/225/315 deg,
    # one 6 mm locating-pin hole at -Y, 6 mm deep centring recess.
    robots: [xarm5_1305, xarm6_1305, xarm7_1305, uf850]
  lite6:
    # Shares the ISO 9409-1-50-4-M6 bolt pattern with xarm, kept separate so Lite 6 tools stay scoped to Lite 6.
    robots: [lite6]
end_effectors:
  gripper_g2:
    source: gripper_g2/gripper_g2_movable_visual.urdf
    base_link: xarm_gripper_base_link
    mount_joint: gripper_fix
    flange: xarm
    # The base collides as 10 convex hulls, so its STL visual is the full mesh rather than its collision geometry.
    stl_visuals:
      xarm_gripper_base_link: gripper_g2/meshes/visual/base_link.stl
    stl_materials:
      xarm_gripper_base_link: White
      "*": Silver
  bio_gripper_g2:
    source: bio_gripper_g2/bio_gripper_g2_movable_visual.urdf
    base_link: bio_gripper_g2_base_link
    mount_joint: bio_gripper_g2_attach
    flange: xarm
    # The part frame is not at the adapter: in it the adapter sits at (-22.636, -0.956, -2.516) mm with
    # rpy (0.031, 0.254, 0.360) deg. This mount puts the adapter centre on the flange axis and the adapter
    # face at z=0, with the adapter's two M6 through-holes over the 135/225 deg holes. It uses yaw only:
    # the 0.25 deg tilt is a GLB placement artifact (two flat faces cannot tilt), and adding it would make
    # TCP-down poses unreachable on xArm5 and near-singular on xArm6. Visual fingertips land about 158 mm
    # from the flange axis (CAD reference 157.5 mm).
    mount: {xyz: [0.022642, 0.000814, 0.002516], rpy: [0.0, 0.0, -0.00628537]}
  vacuum_gripper:
    source: vacuum_gripper/vacuum_gripper.urdf
    base_link: xarm_vacuum_gripper_link
    mount_joint: vacuum_gripper_fix
    flange: xarm
    stl_visuals:
      xarm_vacuum_gripper_link: vacuum_gripper/meshes/visual/vacuum_gripper_visual.stl
  lite6_gripper:
    source: lite6_gripper/lite6_gripper_movable_visual.urdf
    base_link: uflite_gripper_link
    mount_joint: gripper_fix
    flange: lite6
    stl_materials:
      uflite_gripper_link: White
  lite6_vacuum_gripper:
    source: lite6_vacuum_gripper/lite6_vacuum_gripper.urdf
    base_link: uflite_vacuum_gripper_link
    mount_joint: vacuum_gripper_fix
    flange: lite6
    glb_visuals:
      uflite_vacuum_gripper_link: lite6_vacuum_gripper/meshes/visual/lite6_vacuum_gripper_visual_link6.glb
spacers:
  camera_stand:
    # UFACTORY 3 mm aluminium camera stand, 48 g. Its frame has the plate thickness along +Y, so the mount turns
    # +Y onto flange +Z. Fits both xarm and lite6 (ISO 9409-1-50-4-M6 flange). Camera holes around (67.5, 3, 0) mm:
    # 2 x M3 at 20 mm and at 45 mm, and a 20 x 20 mm square of 4 x M3. Bio Gripper G2 is excluded: its body
    # reaches x = 59.22 mm and hits D405/D435.
    source: camera_stand/camera_stand.urdf
    base_link: camera_stand
    mount_joint: camera_stand_fix
    flanges: [xarm, lite6]
    mount: {xyz: [0.0, 0.0, 0.0], rpy: [1.5707963267948966, 0.0, 0.0]}
    tool_lift_m: 0.003
    end_effectors: [gripper_g2, vacuum_gripper, lite6_gripper, lite6_vacuum_gripper]
    stl_visuals:
      camera_stand: camera_stand/meshes/visual/camera_stand.stl
    stl_materials:
      camera_stand: StandAluminum
cameras:
  # Mount poses put each camera's rear mounting face on the stand face with its holes on the stand's holes. Every
  # camera looks along flange +Z with its top towards flange +X.
  d405:
    # Rear 2 x M3 at 20 mm.
    source: d405/d405.urdf
    base_link: d405_body
    mount_joint: d405_fix
    spacer: camera_stand
    mount: {xyz: [0.0675, 0.026, 0.0], rpy: [-1.5707963267948966, -1.5707963267948966, 0.0]}
    optical_frame: d405_optical_frame
    stl_materials: {"*": d405_housing}
  d435:
    # Rear 2 x M3 at 45 mm; 0.055 mm gap because the ROS mesh pokes 0.0547 mm past its nominal rear face.
    source: d435/d435.urdf
    base_link: d435_body
    mount_joint: d435_fix
    spacer: camera_stand
    mount: {xyz: [0.0675, 0.028055, 0.0], rpy: [-1.5707963267948966, -1.5707963267948966, 0.0]}
    optical_frame: d435_optical_frame
    stl_materials: {"*": d435_housing}
  gemini_305:
    # Rear 2 x M3 at 20 mm.
    source: gemini_305/gemini_305.urdf
    base_link: gemini_305_body
    mount_joint: gemini_305_fix
    spacer: camera_stand
    mount: {xyz: [0.084677002, 0.026076703, -0.018348755], rpy: [-3.141592653589793, -1.5707963267948966, 0.0]}
    optical_frame: gemini_305_optical_frame
    stl_materials: {"*": gemini_305_housing}
  zed_x_nano:
    # Rear 20 x 20 mm square of 4 x M3; the GMSL2 connector passes through the stand's centre opening.
    source: zed_x_nano/zed_x_nano.urdf
    base_link: zed_x_nano_body
    mount_joint: zed_x_nano_fix
    spacer: camera_stand
    mount: {xyz: [0.052237, 0.02357, 0.0], rpy: [-3.141592653589793, -1.5707963267948966, 0.0]}
    optical_frame: zed_x_nano_optical_frame
    stl_materials: {"*": zed_x_nano_housing}
base_plates:
  xarm_base_plate:
    # UFACTORY 8 mm aluminium mounting plate (136 x 185 mm, long edge along Y, two-chamfered tongue facing +X).
    source: xarm_base_plate/xarm_base_plate.urdf
    base_link: xarm_base_plate
    mount_joint: base_plate_fix
    robots: [xarm5_1305, xarm6_1305, xarm7_1305]
    thickness_m: 0.008
    mount: {xyz: [0.0, 0.0, 0.0], rpy: [0.0, 0.0, 0.0]}
    stl_materials: {"*": PlateAluminum}
  uf850_base_plate:
    # UFACTORY 10 mm aluminium mounting plate (190 x 260 mm, long edge along Y).
    source: uf850_base_plate/uf850_base_plate.urdf
    base_link: uf850_base_plate
    mount_joint: base_plate_fix
    robots: [uf850]
    thickness_m: 0.010
    mount: {xyz: [0.0, 0.0, 0.0], rpy: [0.0, 0.0, 0.0]}
    stl_materials: {"*": PlateAluminum}
  lite6_base_plate:
    # UFACTORY 5 mm aluminium mounting plate (130 x 190 mm, long edge along Y).
    # Lite 6's four base mounting holes are centred at (-3, 0) mm in link_base.
    source: lite6_base_plate/lite6_base_plate.urdf
    base_link: lite6_base_plate
    mount_joint: base_plate_fix
    robots: [lite6]
    thickness_m: 0.005
    mount: {xyz: [-0.003, 0.0, 0.0], rpy: [0.0, 0.0, 0.0]}
    stl_materials: {"*": PlateAluminum}
