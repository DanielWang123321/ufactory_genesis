# End-to-end tabletop pick-and-place, pure PPO from the fixed home pose.
schema_version: 1
environment:
  task_name: pick_place
  env_version: 3
  num_envs: 2048
  num_obs: 70
  num_actions: 4
  genesis_performance_mode: false
  control: cartesian_and_g2_gap_increment
  action_scale: 0.005
  action_clip: 1.0
  gap_action_scale: 0.003
  setpoint_leash_m: 0.025
  pre_grasp_gap_m: 0.050
  close_floor_gap_m: 0.012
  reward_gamma: 0.995
  place_clearance_m: 0.002
  release_max_height_m: 0.003
  press_limit_m: 0.001
  near_table_m: 0.020
  max_near_table_descent_m_s: 0.020
  table_overload_margin_n: 1.0
  place_success_dist_m: 0.020
  drag_limit_m: 0.010
  tilt_limit_deg: 15.0
  success_hold_steps: 10
reward:
  approach_potential: 8.0
  pregrasp_potential: 4.0
  grasp_potential: 4.0
  lift_potential: 40.0
  transit_potential: 8.0
  place_potential: 6.0
  release_potential: 4.0
  hold_potential: 6.0
  first_contact: 2.0
  first_lift: 6.0
  first_place: 10.0
  success: 40.0
  failure_penalty: 10.0
  fast_descent_penalty: 10.0
  press_penalty: 3000.0
  recontact_penalty: 5.0
  table_overload_penalty: 0.1
  high_release_penalty: 10.0
  robot_table_penalty: 1.0
  action_penalty: 0.001
  action_saturation_penalty: 0.0
  step_penalty: 0.005
train:
  algorithm:
    class_name: PPO
    clip_param: 0.2
    desired_kl: 0.01
    entropy_coef: 0.005
    gamma: 0.995
    lam: 0.95
    learning_rate: 3.0e-04
    max_grad_norm: 1.0
    num_learning_epochs: 5
    num_mini_batches: 8
    schedule: fixed
    use_clipped_value_loss: true
    value_loss_coef: 1.0
    rnd_cfg: null
    symmetry_cfg: null
  actor:
    class_name: MLPModel
    hidden_dims: [256, 256]
    activation: elu
    obs_normalization: false
    distribution_cfg:
      class_name: GaussianDistribution
      init_std: 0.50
      std_type: scalar
  critic:
    class_name: MLPModel
    hidden_dims: [256, 256]
    activation: elu
    obs_normalization: false
  obs_groups:
    actor: [policy]
    critic: [policy]
  runner:
    checkpoint: -1
    experiment_name: pick_place_e2e_s1
    load_run: -1
    log_interval: 1
    max_iterations: 2000
    early_stop_evaluations: 2
    record_interval: -1
    resume: false
    resume_path: null
    run_name: ""
  num_steps_per_env: 32
  save_interval: 50
  seed: 1
  run_name: ""
  logger: tensorboard
