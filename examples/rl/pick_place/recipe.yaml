# Fixed-layout pick-place with contact-grounded state and a consolidated reward set.
#
# Differences from the quality-phase recipes that preceded it:
#   * The policy sees real pad separation and contact load, not just the drive angle
#     mapped through a straight line, and "holding" now requires both pads to be loaded.
#   * The gripper command floor drops below the nominal grasp gap so the pads can build
#     real squeeze force once the drive stalls on the cube.
#   * Cartesian deltas integrate onto a commanded setpoint, so a zero action holds still
#     instead of sinking; action_scale/max_cartesian_delta are 0.005 with a squared
#     response for fine near-table control.
#   * Reward terms are cut from twenty-plus to about a dozen, one per behaviour the
#     strict acceptance test actually measures.
schema_version: 1
environment:
  num_envs: 20480
  genesis_performance_mode: true
  randomize_initial_episode_length: true
  actor_output_tanh: false
  # Layered guidance: the policy observes the scripted guide action (4 extra columns,
  # 44 -> 48). Disclosed per the v0.2.12 precedent; the guide shares the hashed expert
  # config below, so BC labels and observations can never disagree.
  num_obs: 48
  include_scripted_action_hint: true
  num_actions: 4
  include_commanded_gap: true
  include_previous_action: true
  include_quality_observations: true
  include_contact_observations: true
  include_normalized_layout_offsets: false
  use_contact_holding: true
  privileged_critic_obs: true
  strict_action_bounds: true
  # Hashed expert parameters shared by BC labelling and the observation hint.
  scripted_action_hint_controller: scripted_pick_place_expert_v1
  scripted_action_hint_config:
    latch_layout_setpoints: true
    brake_only_near_table: true
    grasp_y_compensation_m: 0.0
    grasp_y_centering_gain: 0.06
    grasp_y_compensation_limit_m: 0.003
    close_gap_m: 0.022
    near_table_margin_m: 0.045
    near_table_xy_step_m: 0.0004
    near_table_z_step_m: 0.0006
    setdown_ramp_offset_m: 0.0
    setdown_ramp_gain: 0.10
    release_hover_m: 0.0001
    coarse_step_m: 0.005
    descend_step_m: 0.003
    landing_brake_speed_m_s: 0.025
    landing_brake_max_step_m: 0.0005
  # Plan: 0.01 → 0.005 so near-table 0.03 m/s (~0.6 mm/step) is reachable
  # without squeezing actions into a ±0.06 band. Squared response keeps fine
  # control near zero; commanded integration stops zero-action sink.
  action_scale: 0.005
  action_clip: 1.0
  action_response_exponent: 2.0
  max_cartesian_delta_m: 0.005
  ee_command_integration: commanded
  ee_setpoint_leash_m: 0.02
  max_ik_jump_rad: 0.5
  gripper_delta_mm: 4.0
  gripper_min_command_gap_m: 0.012
  contact_force_scale_n: 5.0
  contact_force_threshold_n: 0.05
  success_history_len: 4096
  fixed_demo_layout: true
  randomize_target: false
  curriculum_initial_stage: 0
  curriculum_max_stage: 0
  curriculum_min_count: 1024
  curriculum_stage0_grasp_rate: 0.95
  curriculum_stage1_grasp_rate: 0.90
  curriculum_stage2_place_rate: 0.90
  curriculum_stage3_place_rate: 0.85
  place_phase_reset_frac: 0.40
  place_phase_hover_z_m: 0.07
  carry_phase_reset_frac: 0.30
  carry_phase_hover_z_m: 0.10
  grasp_phase_reset_frac: 0.15
  grasp_phase_reset_frac_final: 0.0
  grasp_phase_anneal_steps: 12800
  held_gripper_initial_drive: 0.60
  carry_near_dist_m: 0.040
  place_shaping_dist_m: 0.040
  release_success_dist_m: 0.010
  place_success_dist_m: 0.010
  place_lower_near_factor: 1.0
  success_table_z_tolerance_m: 0.005
  success_max_obj_speed_m_s: 0.020
  success_hold_steps: 25
  release_height_tolerance_m: 0.005
  release_max_obj_speed_m_s: 0.020
  pre_lift_max_drag_m: 0.005
  post_release_max_drift_m: 0.003
  landing_near_table_height_m: 0.020
  landing_max_xy_speed_m_s: 0.030
  landing_max_down_speed_m_s: 0.050
  near_table_xy_action_height_m: 0.025
  release_action_threshold: 0.05
  # Release-intent hysteresis. The hold regulator parks the commanded gap at
  # close_gap (about 22 mm); with gripper_delta_mm=4 the integrated command
  # random-walks ~1.4 mm per episode under sigma=0.02 action noise, so the old
  # 0.5 mm default latched phantom releases at the pickup every episode. A real
  # release ramps the command to 45-84 mm, so an 18 mm intent margin only adds
  # ~0.3 s of detection lag while the pads are still on the cube.
  release_command_margin_m: 0.018
  quality_velocity_obs_scale_m_s: 0.25
  clean_lift_reward_scale_m: 0.005
  grasp_centering_reward_scale_m: 0.005
reward:
  # Reach and align on the cube.
  approach_potential: 25.0
  grasp_settle_action: 30.0
  grasp_gap_progress: 30.0
  # Leave the table cleanly and centred: an off-centre lift becomes placement error.
  pre_lift_xy_progress: 200.0
  clean_lift_quality: 60.0
  grasp_centering: 60.0
  grasp_lift_progress: 60.0
  # Carry to the target and set down without impact.
  transport_progress: 40.0
  descent_progress: 60.0
  near_table_xy_action: 100.0
  hard_landing: 100.0
  # Open only where the strict release gate is already satisfied.
  release_readiness_progress: 60.0
  valid_release: 200.0
  invalid_release: 200.0
  success: 100.0
  # Safety.
  action_penalty: 0.0005
  table_collision: 2.0
  workspace_violation: 2.0
train:
  algorithm:
    class_name: PPO
    clip_param: 0.2
    desired_kl: 0.01
    entropy_coef: 0.005
    gamma: 0.99
    lam: 0.95
    learning_rate: 1.0e-05
    max_grad_norm: 1.0
    num_learning_epochs: 5
    num_mini_batches: 8
    schedule: fixed
    use_clipped_value_loss: true
    value_loss_coef: 1.0
    rnd_cfg: null
    symmetry_cfg: null
    # Runs start from a behaviour-cloned actor paired with a freshly initialised critic,
    # so the first updates carry noisy advantages. A small fixed step lets the critic
    # catch up without spending the cloned grasp on them.
  actor:
    class_name: MLPModel
    hidden_dims: [256, 256, 128]
    activation: elu
    obs_normalization: false
    distribution_cfg:
      class_name: BetaDistribution
      action_range: [-1.0, 1.0]
  critic:
    class_name: MLPModel
    hidden_dims: [256, 256, 128]
    activation: elu
    obs_normalization: true
  obs_groups:
    actor: [policy]
    critic: [policy, privileged]
  runner:
    checkpoint: -1
    experiment_name: xarm6-pick-place-contact-v1
    load_run: -1
    log_interval: 1
    max_iterations: 300
    record_interval: -1
    resume: false
    resume_path: null
    run_name: ""
  num_steps_per_env: 128
  save_interval: 10
  seed: 1
  run_name: ""
  logger: tensorboard
