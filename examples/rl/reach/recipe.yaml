schema_version: 1
environment:
  num_envs: 16384
  genesis_performance_mode: true
  randomize_initial_episode_length: true
reward:
  reach: 1.0
  action_penalty: 0.001
  success: 2.0
train:
  algorithm:
    class_name: PPO
    clip_param: 0.2
    desired_kl: 0.01
    entropy_coef: 0.001
    gamma: 0.99
    lam: 0.95
    learning_rate: 0.0003
    max_grad_norm: 1.0
    num_learning_epochs: 5
    num_mini_batches: 4
    schedule: fixed
    use_clipped_value_loss: true
    value_loss_coef: 1.0
    rnd_cfg: null
    symmetry_cfg: null
  actor:
    class_name: MLPModel
    hidden_dims: [256, 256, 128]
    activation: elu
    obs_normalization: true
    distribution_cfg:
      class_name: BetaDistribution
      action_range: [-1.0, 1.0]
  critic:
    class_name: MLPModel
    hidden_dims: [256, 256, 128]
    activation: elu
    obs_normalization: true
  obs_groups:
    actor: [policy]
    critic: [policy]
  runner:
    checkpoint: -1
    experiment_name: xarm6-reach
    load_run: -1
    log_interval: 1
    max_iterations: 300
    record_interval: -1
    resume: false
    resume_path: null
    run_name: ""
  num_steps_per_env: 24
  save_interval: 25
  seed: 1
  run_name: ""
  logger: tensorboard
