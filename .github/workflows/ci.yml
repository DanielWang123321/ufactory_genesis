name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  fast:
    name: project-check fast (CPU, py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package (dev only; no Genesis / Torch)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Project checks
        run: python -m ufactory.quality.project_check fast --report reports/project-check/ci_fast.json

      - name: Upload check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-check-fast-py${{ matrix.python-version }}
          path: reports/project-check/ci_fast.json
